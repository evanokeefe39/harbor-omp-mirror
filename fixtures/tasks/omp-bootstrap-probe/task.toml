schema_version = "1.1"

[task]
name = "harbor-omp/omp-bootstrap-probe"
description = "Verifies the OMP config bootstrap: agent-dir tree and MCP merge."
authors = []
keywords = []

[metadata]
difficulty = "easy"
category = "programming"
tags = [ "omp", "bootstrap", "mcp" ]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
# Declared so the agent must merge it into the bootstrapped mcp.json (R5).
[[environment.mcp_servers]]
name = "harbor-task-server"
transport = "streamable-http"
url = "http://127.0.0.1:9/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
