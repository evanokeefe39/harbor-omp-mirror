# The Daytona pair (jobs/omp-daytona-ade-bench.yaml) with one change: the config
# root is a published omp-config-mirror release, fetched by tag through the
# `config_url` route (OAV-32). A result from this job names a config anyone can
# fetch and read, the same identity omp-home's `Agent-Identity` commit trailer
# carries (`omp-config-mirror@<tag>`), rather than a stage only this machine has.
#
#   GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.autocrlf GIT_CONFIG_VALUE_0=false \
#   uv run harbor run -c jobs/omp-mirror-config.yaml --yes \
#     --env-file <env-file> -o <jobs-dir> --job-name <run-name>
#
# What the trial gets: the tag's GitHub tarball, downloaded by `curl` inside the
# sandbox with no credentials (the mirror is public), checked against
# `config_sha256` before extraction, its single top-level directory stripped, and
# extracted to `$HOME/.omp`. The agent directory is `agent/`, which is
# `config_subdir`'s default. Unlike the `config_dir` route, which uploads the
# agent directory only, this carries the whole root, `plugins/` included.
#
# What it is not: the operator's live config. The mirror is allow-listed and
# redacted line by line (omp-home `agent/scripts/mirror-config.sh`), so its
# `AGENTS.md`, `WORKFLOWS.md` and `models.yml` differ from the live files, and it
# is unfiltered by the eval profile: the herdr and `omp-identity` extensions, the
# command hooks and the `backlog` MCP server all ship. A/B measurement of the
# live harness stays with the staged arms (jobs/omp-ab-config.yaml); this job is
# for a result that will be published or cited.
#
# Moving to a new release is three lines, all from the mirror's tags
# (`gh api repos/evanokeefe39/omp-config-mirror/tags`):
#   config_url     .../archive/refs/tags/<tag>.tar.gz
#   config_sha256  sha256 of that tarball. Two downloads of omp-home-v0.7.1 on
#                  2026-10-19 hashed identically, but GitHub does not guarantee
#                  a source archive stays byte-identical (docs/bootstrap.md), so a
#                  mismatch one day means re-download and re-check, not tampering
#                  by default. Either way the trial fails in setup, loudly.
#   config_ref     omp-config-mirror@<tag> (<the tag's commit>): the commit is
#                  the durable pin, since a digest only guards one download.
#
# An unknown tag returns 404, `curl -f` fails, and the trial stops in setup
# before the agent starts, with the URL, and so the tag, in the error.

job_name: omp-mirror-config
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      version: "18.11.1"
      thinking: high
      config_url: "https://github.com/evanokeefe39/omp-config-mirror/archive/refs/tags/omp-home-v0.7.1.tar.gz"
      config_sha256: "eb3e9e63f291c324a0bc2739392b8ed384ca33bbd23c898e92928c7d07b3b2bf"
      config_ref: "omp-config-mirror@omp-home-v0.7.1 (9885a1c8f07ca5fc1724cbdcf72137ff7507c4fe)"

# Everything below is the Daytona pair's, unchanged; its header explains each.
environment:
  type: daytona
  override_memory_mb: 2048
  env:
    DBT_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"
    DBT_ENGINE_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"

datasets:
  - name: ade-bench
    task_names:
      - ade-bench-*
    n_tasks: 2

n_concurrent_trials: 1

agent_timeout_multiplier: 2.0
