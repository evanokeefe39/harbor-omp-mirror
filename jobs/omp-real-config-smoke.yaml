# One ade-bench task, real config, full run — the cheapest end-to-end proof that
# a bootstrapped ~/.omp is discovered by the CLI inside the container.
#
#   uv run python scripts/stage_omp_config.py     # writes .staged/omp-agent
#   uv run harbor run -c jobs/omp-real-config-smoke.yaml --yes -o <fresh-dir>
#
# The install-only probe (jobs/omp-install-smoke.yaml) already proved the image
# build, the Bun install and the package install. This adds the two things it
# skips: the agent actually running against the task, and the verifier grading
# it — with a config directory layered on.
#
# One named task, where jobs/ade-bench-smoke.yaml takes two by wildcard: this is
# the cheapest full run, that one covers selection breadth.
#
# ADE-bench downloads its DuckDB databases during image build, so the first run
# of a task needs internet.

job_name: omp-real-config-smoke
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      # Pinned: an unpinned run installs @latest, so its result is not
      # comparable to the one recorded in docs/examples.md.
      version: "18.11.1"
      thinking: high
      config_dir: .staged/omp-agent

environment:
  type: docker

datasets:
  - name: ade-bench
    task_names:
      - ade-bench-ana-eng008

n_concurrent_trials: 1
