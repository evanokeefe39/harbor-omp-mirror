# Treatment arm: data engineering (`slice-data`: base + the data-eng skills, agents and subagents).
#
# An arm is one side of a comparison, and this file is not run on its own. Its
# reference is `jobs/omp-ab-baseline.yaml` over the **same task ids**, so the two
# line up per task; `jobs/omp-ab-config.yaml` is the other end of the scale —
# the entire config — and answers the different question of whether the whole
# thing helps.
#
# config root: `.staged/slices/data` — base plus only this domain's skills, agents and
# subagents. `scripts/stage_omp_config.py` takes `--exclude`/`--exclude-path`
# and has no slice concept yet, so that root is built by hand for now. It is
# named here so a run cannot silently measure the full config against itself.
# **Neither this arm nor its base has been run**; these files exist so the
# experiment is defined before it is spent.
#
# Why these benchmarks — this is the only pair of families that grades a *data artifact* rather than a description of one — ade-bench by running dbt singular tests over the models the agent wrote (4-48 subtests per task), dabstep by a vendored stdlib scorer over answers to multi-step questions on local files. Both are keyless and hermetic, so a difference between arms is the config.
#
# Reading the result: per task, graded (subtests or named checks), never the
# mean, and one flipped task is the measured noise floor — 0.25 of a mean swing
# under a byte-identical config.
#
# 9 trials.
job_name: omp-slice-data
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      version: "18.11.1"
      thinking: high
      config_dir: .staged/slices/data

environment:
  type: daytona
  override_memory_mb: 4096
  env:
    DBT_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"
    DBT_ENGINE_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"

datasets:
  # Data engineering: dbt models over messy sources, graded by singular dbt tests.
  # Same five as the bundle, so this arm's results are comparable task-for-task
  # with the base arm's.
  - name: ade-bench
    task_names:
      - ade-bench-quickbooks004
      - ade-bench-asana003
      - ade-bench-airbnb005
      - ade-bench-ana-eng006
      - ade-bench-asana004

  # Analytics reasoning over local files: no dbt, no warehouse, no network.
  - name: dabstep
    task_names:
      - dabstep-24
      - dabstep-51
      - dabstep-53
      - dabstep-57

n_concurrent_trials: 2

# A slow backend must not be recorded as a failed agent: with the noise measured
# here, a timeout recorded as an agent failure is the largest source of a false
# effect.
agent_timeout_multiplier: 2.0
