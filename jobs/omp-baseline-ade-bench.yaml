# The milestone's baseline half: the agent on OMP's *bundled defaults* — no
# `config_dir` at all — against the registry dataset the milestone is scored on.
#
#   uv run harbor run -c jobs/omp-baseline-ade-bench.yaml --yes -o <fresh-dir>
#
# Same registry dataset and the same two-task selection as
# jobs/ade-bench-smoke.yaml, which layers `.staged/omp-agent` on; run against
# each other they isolate what a bootstrapped ~/.omp adds to the outcome. Two
# deliberate deviations from vanilla keep the runs comparable — the
# `thinking: high` kwarg, and the two-task `ade-bench-*` selection — and
# nothing else is set.
#
# No `config_dir` means the container's ~/.omp is empty, so OMP runs its bundled
# defaults. The advisor is off by construction. **Mechanism:** `advisor.enabled`
# defaults to false (`omp config list` on this machine; `omp://settings.md`,
# Advisor table), and it is turned on only by that setting, by the interactive
# `/advisor on`, or by the `--advisor` flag (`omp --help`) — none of which this
# job, or an empty config root, supplies. **Demonstration:** an advisor that ran
# appends `__advisor.jsonl` beside the session file (`omp://advisor-watchdog.md`,
# "Transcript persistence"), which is exactly why the session-candidate filter in
# `docs/spec.md` drops that name — so
# `<job>/<trial>/agent/omp/sessions/**` holding no `__advisor*.jsonl` beside the
# primary session JSONL is evidence, not an assumption of absence.
#
# ADE-bench is dbt Labs' *Analytics Data Engineer Bench* — a different benchmark
# from Snowflake Labs' data-eng-bench, and the one that actually lives in the
# Harbor registry: `harbor run -d ade-bench` resolves 48 tasks. Tasks are dbt
# projects backed by DuckDB, graded by singular dbt tests.
#
# Note the DuckDB databases are downloaded during image build, so the first run
# of each task needs internet. Always pass a fresh `-o`: a re-run into an
# existing jobs_dir can replay the cached trial while rewriting its mtimes.
#
# Validate without spending anything:
#   uv run harbor run -c jobs/omp-baseline-ade-bench.yaml --print-config
#   uv run harbor run -c jobs/omp-baseline-ade-bench.yaml --dry-run

job_name: omp-baseline-ade-bench
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      # Pinned: an unpinned run installs @latest, so its result is not
      # comparable to the one recorded in docs/examples.md.
      version: "18.11.1"
      thinking: high

environment:
  type: docker

datasets:
  - name: ade-bench
    task_names:
      - ade-bench-*
    n_tasks: 2

n_concurrent_trials: 1
