# The 8 GiB memory tier of the ADE-bench suite on the Daytona backend.
#
# Sibling of jobs/omp-daytona-ade-bench-full.yaml (same agent, same backend,
# same four deviations), holding **only** the tasks that exceed 4 GiB. The full
# job excludes them by name, so neither job runs a task the other runs — and the
# pair covers **47 of the dataset's 48**, not all of it: `ade-bench-asana005` is in
# neither job, by design, for the reason given below. A task in both jobs is run
# twice; a task in neither is dropped from the suite.
#
#   uv run harbor run -c jobs/omp-daytona-ade-bench-full.yaml  --yes ... -o <fresh-dir>
#   uv run harbor run -c jobs/omp-daytona-ade-bench-heavy.yaml --yes ... -o <fresh-dir>
#
# Why tiers exist at all. `override_memory_mb` is a *job* setting and
# `n_concurrent_trials` is job-global, so one job cannot run an 8 GiB task
# beside a 4 GiB one without sizing concurrency for the largest — throwing away
# the concurrency the split is for. Harbor reads no per-task memory from a job:
# the only per-task field is the task's own `task.toml` `memory_mb`, and all 48
# ade-bench tasks declare 4096, so the tiers have to be separate jobs.
#
# Membership is **measured, not assumed**, and each claim names the artifact it
# rests on. `agent/postmortem.txt` is where a kill is visible — the cgroup
# `oom_kill` counter and, beside it, the `memory.max` the trial ran under — and
# `agent/resource-probe.log` is where the peak comes from. Measured:
#
#   ade-bench-ana-eng007-medium   OOM-killed at 4096: `oom_kill 1`, exit 137,
#                                 `memory.max` 4294967296, and the last sampled
#                                 `memory.current` 128 KiB below it. At 8192 it
#                                 peaked at 1976 MiB, exited cleanly and **scored
#                                 1.0** where it had scored 0 under the cap: here
#                                 the ceiling was the binding constraint. Peak is
#                                 cap-dependent, so the kill, not the peak, is
#                                 what keeps the task here. On 2026-10-18 at 8192
#                                 it peaked at 2067 MiB and scored 1.0 again.
#   ade-bench-intercom003         OOM-killed at 4096 on 2026-10-18: `oom_kill 1`,
#                                 exit 137, `memory.max` 4294967296, while the
#                                 sampled peak read 1968 MiB — the probe samples
#                                 every 2 s and the spike fell between samples.
#                                 One observation; the kill, not the peak, is
#                                 what moves it here.
#   ade-bench-asana005            OOM-killed **at 8192** on 2026-10-17: `oom_kill 1`,
#                                 exit 137, `memory.max` 8589934592, score 0, peak
#                                 6531 MiB. At 4096 on the same day it survived —
#                                 2837 MiB peak, no post-mortem, no exception. Its
#                                 2026-10-16 exit 137 is real and **unattributed**:
#                                 no artifact says it was an OOM, and the 4096
#                                 re-run is evidence against the obvious reading.
#                                 `docs/environments/daytona.md` records the same
#                                 caution. The exclusion rests on the 8192 kill,
#                                 not on the 2026-10-16 one.
#
# 8192 is also **Daytona's per-sandbox maximum**: a 10240 MiB probe is refused
# with "Memory request 10GB exceeds maximum allowed per sandbox (8GB)", so no
# sandbox this platform can create fits `ade-bench-asana005` — the size that
# killed it is the size it cannot exceed. It is therefore **excluded from the
# suite**, named in the full job's `exclude_task_names` for that reason and
# deliberately absent from `task_names` below; running it records a zero that
# belongs to the platform. DEFECTS.md carries the row.
#
# `scripts/plan_memory_tiers.py` derives those verdicts from the trial's own
# artifacts and is the authority on the task lists:
#
#   uv run python scripts/plan_memory_tiers.py .staged/runs/<run>[...]
#
# Keep the two lists in step with the full job's `exclude_task_names`: a task in
# both jobs is run twice, and a task in neither is silently dropped from the
# suite.
#
# 8 GiB per sandbox against the org's cap of 10 GiB — a figure this repo's own
# `docs/environments/daytona.md` records as coming from a job header rather than
# from a run that swept it — means **one** trial at a time:
# `n_concurrent_trials: 1`. This job is the slow one by construction; it is
# small so that the cost is bounded.
#
# Egress: the same commit-pinned dbt index mirror as the other Daytona jobs, so
# `dbt deps` resolves inside the sandbox. See the full job's header for the
# measurement and for the two spellings (`DBT_PACKAGE_HUB_URL` for dbt <= 1.10,
# `DBT_ENGINE_PACKAGE_HUB_URL` for 1.11+).
job_name: omp-daytona-ade-bench-heavy
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      version: "18.11.1"
      thinking: high

environment:
  type: daytona
  # 4 GiB is where these tasks died; 8192 is the next whole-GiB step.
  override_memory_mb: 8192
  env:
    DBT_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"
    DBT_ENGINE_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"

datasets:
  - name: ade-bench
    task_names:
      - ade-bench-ana-eng007-medium
      - ade-bench-intercom003

# 8 GiB each against a 10 GiB pool: one at a time.
n_concurrent_trials: 1

agent_timeout_multiplier: 2.0
