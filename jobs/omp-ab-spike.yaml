# A one-task spike per candidate family, for the axis `jobs/omp-ab-*.yaml` cannot
# yet cover: web/front-end with a non-judge grader.
#
# RESULT, 2026-10-17, run with `-a oracle` into
# `.staged/runs/omp-ab-spike-oracle` (3m10s, `SPIKE_EXIT=0`):
#
#   skill2env  PASSED, and is now in both arms. Both trials scored 1.0 with the
#              verifier's own diagnostics read from the run:
#              `[synchronization] PASS repeat build is idempotent`,
#              `[metamorphic] PASS rider chart.emphasis override locality`,
#              `[authoring_model] PASS master token coverage: 30 rows`, and a
#              `gallery-results.json` of per-check pass/fail with computed style
#              values. Named, deterministic checks — not a rubric and not a
#              model's opinion, which is what the spike existed to settle.
#              Reward is 5-6 sub-metrics per task, the finest gradient we have.
#   webbench   FAILED TO BUILD, both trials: `RuntimeError: docker compose build
#              failed` while resolving
#              `mcr.microsoft.com/playwright/python:v1.58.0-noble`, connection
#              reset by peer. Not an agent failure and not a scoring question —
#              the family cannot start on this backend. Recorded in arm A's
#              exclusion list rather than left as an open question.
#
# Re-run this file only to re-answer those two questions; it is a diagnostic, and
# its result is written into arm A's header where a reader will look.
#
# This is not an A/B arm and must not be read as one. It answers a single
# question per family — **does the verifier actually run, and is its grading
# executable rather than a model's opinion?** Both candidates claimed exactly
# that in their own documentation, and in both cases the claim was unverifiable
# from outside: their Hub package archives are auth-gated, so no `tests/test.sh`
# can be read. A claim in a README is not a verifier. A run is.
#
#   blobfishai/webbench — WebScore = 100 * prod(gates) * sum(w_i v_i) / sum(w_i),
#     documented as "0 LLM grading calls", shipped with `tests/controls.json`
#     (oracle 137/137, noop 0, wrong-record <= 0.35). Browser-driven over a
#     `world.db`, two images, Playwright.
#   skill2env — a design-token compiler with a static gallery: DTCG
#     `tokens.json`/`tokens.css`, byte-identical repeat runs, rejection of
#     duplicate/unknown/malformed overrides, no overflow at 390 px and 1440 px,
#     44 px targets, offline runtime. The front-end design and its review-shaped
#     counterpart are the two tasks here.
#
# What each outcome means:
#
#   * `tests/test.sh` readable in the job output and reward written from a real
#     check -> promote the family into both arms (four task IDs each, keeping the
#     arms' diff at exactly two lines).
#   * reward comes from a model call, or the suite ships no controls -> keep it
#     out, and record it in the arm-A exclusion list. `webgen-bench`,
#     `mimo-v26-webdev` and `o11y-bench` are already excluded for this reason,
#     which is why the spike is worth running: the axis has no other candidate.
#   * unreadable or missing resources -> the axis stays unmeasured. Say so; do
#     not substitute a judged family for a missing executable one.
#
# Run the controls first, not the agent — a control that cannot score proves the
# grader is broken, and the agent's own failure would hide that:
#
#   uv run harbor run -c jobs/omp-ab-spike.yaml --yes -o .staged/runs \
#     --job-name omp-ab-spike-controls
#
# The two task IDs are the ones the scout read from the Hub listings and the
# dataset README on 2026-10-17. They are pinned here rather than in the arms so a
# failed spike costs two trials, not two arms.
job_name: omp-ab-spike
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      version: "18.11.1"
      thinking: high

environment:
  type: daytona
  override_memory_mb: 4096

datasets:
  # Browser-driven work over a local SQLite world, two worlds so the spike shows
  # whether the longer chain behaves differently from the short one.
  - name: blobfishai/webbench
    task_names:
      - blobfishai/wb-deskops-deskops-001-budget-reserve-7cd522-s0
      - blobfishai/wb-workplace-workplace-001-usable-capacity-87d413-s10

  # The design-artifact family, and the one candidate on this axis that is
  # offline: a token contract compiled to CSS and checked both for content and
  # for byte-identical repeat output. `_review` is the review-shaped counterpart.
  - name: skill2env/skill2env
    task_names:
      - skill2env/task_frontend-design_omc8cag2
      - skill2env/task_frontend-design-review_pjl5uaib

n_concurrent_trials: 1
agent_timeout_multiplier: 2.0
