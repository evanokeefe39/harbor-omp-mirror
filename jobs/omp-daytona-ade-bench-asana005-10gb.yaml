# Diagnostic job: does `ade-bench-asana005` survive the largest sandbox this
# organisation can grant? It is committed because the answer is a standing fact
# about the platform that other jobs' headers depend on.
#
# Measured history. OOM-killed at 8192 MiB on 2026-10-17 (peak 6531 MiB,
# `memory.max` 8589934592, `oom_kill 1`, exit 137, score 0), and at 4096 MiB the
# same day it survived (2837 MiB peak, no post-mortem). 8192 is Daytona's
# **per-sandbox maximum**: this job, at 10240 MiB, never creates a sandbox.
#
#   DaytonaBadRequestError: Failed to create sandbox: Memory request 10GB
#   exceeds maximum allowed per sandbox (8GB).
#
# So the task cannot be measured on this platform at all, and it is excluded
# from the suite (see the heavy job's header and DEFECTS.md). The job is kept as
# the evidence for that, and as the thing to re-run if the vendor raises the
# limit — Daytona directs larger-resource requests to support@daytona.io.
job_name: omp-daytona-ade-bench-asana005-10gb
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      version: "18.11.1"
      thinking: high

environment:
  type: daytona
  override_memory_mb: 10240
  env:
    DBT_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"
    DBT_ENGINE_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"

datasets:
  - name: ade-bench
    task_names:
      - ade-bench-asana005

# The whole pool in one sandbox: nothing else can run beside it.
n_concurrent_trials: 1

agent_timeout_multiplier: 2.0
