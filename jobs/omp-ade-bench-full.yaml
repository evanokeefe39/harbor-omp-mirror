# The whole ADE-bench suite, not a pair.
#
# `ade-bench` resolves from the Harbor registry (`laude-institute/harbor-datasets`,
# path `datasets/ade-bench/`). At the commit measured on 2026-10-16 that is **48
# tasks**; the dataset resolves `@head`, so each trial's `lock.json` records the
# commit it actually used and a count repeated from this header should be checked
# against that. The other jobs in this directory deliberately narrow it with
# `n_tasks: 2` — this one does not, so it is the only job that answers "how does
# the agent do across the benchmark" rather than "does the agent work".
#
#   uv sync
#   uv run harbor run -c jobs/omp-ade-bench-full.yaml --yes -o <fresh-dir>
#
# Expect hours, not minutes. Measured on the two-task pair, a trial costs roughly
# 2-9 minutes of agent time; 48 trials at `n_concurrent_trials: 2` is on the order
# of two hours wall clock, plus the image build for the first one. Model spend
# scales with the suite — the pair's two trials cost $0.07 combined on one run and
# $0.0067/$0.0606 on another, so treat the full run as single-digit dollars and
# check the job's own accounting when it lands.
#
# Concurrency is 2, not 4, on purpose: four concurrent task containers on one
# Windows host is untested, and a benchmark that measures its own resource
# contention is not measuring the agent. Raise it only with a run that shows the
# difference.
#
# No `agent_timeout_multiplier`. The task's own 600 s budget is part of what the
# benchmark measures, so on this job a timeout is a finding rather than an
# artefact to be cushioned. The Daytona job sets 2.0 for the opposite reason:
# there the sandbox is slower to work in and the comparison is against docker.
#
# No `config_dir`: this runs OMP's bundled defaults, so the number is the agent's
# rather than a staged config's. Staging is what `jobs/omp-real-config-smoke.yaml`
# and `jobs/omp-config-surfaces.yaml` exist to exercise.

job_name: omp-ade-bench-full
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      # Pinned: an unpinned run installs @latest, so its result is not
      # comparable to any recorded run.
      version: "18.11.1"
      thinking: high

environment:
  type: docker

datasets:
  - name: ade-bench
    task_names:
      - ade-bench-*
    # No `n_tasks`: take the whole dataset. Every other job here narrows it.

n_concurrent_trials: 2
