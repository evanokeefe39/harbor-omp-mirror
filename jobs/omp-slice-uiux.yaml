# Treatment arm: ui/ux (`slice-uiux`: base + the design and front-end skills, agents and subagents).
#
# An arm is one side of a comparison, and this file is not run on its own. Its
# reference is `jobs/omp-ab-baseline.yaml` over the **same task ids**, so the two
# line up per task; `jobs/omp-ab-config.yaml` is the other end of the scale —
# the entire config — and answers the different question of whether the whole
# thing helps.
#
# config root: `.staged/slices/uiux` — base plus only this domain's skills, agents and
# subagents. `scripts/stage_omp_config.py` takes `--exclude`/`--exclude-path`
# and has no slice concept yet, so that root is built by hand for now. It is
# named here so a run cannot silently measure the full config against itself.
# **Neither this arm nor its base has been run**; these files exist so the
# experiment is defined before it is spent.
#
# Why these benchmarks — skill2env is the one family whose grader is a set of *named deterministic checks* over a design artifact — a token compiler checked for byte-identical rebuilds, override-locality, 44 px targets, no overflow at 390 and 1440 px — so a ui/ux change that alters the artifact moves a check, not a vibe. The three vector-edit-gym tasks are the visual-artifact counterpart, graded by a deterministic structural diff, one with a single defect and one with two at once so sensitivity is not uniform across the three.
#
# Reading the result: per task, graded (subtests or named checks), never the
# mean, and one flipped task is the measured noise floor — 0.25 of a mean swing
# under a byte-identical config.
#
# 6 trials.
job_name: omp-slice-uiux
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      version: "18.11.1"
      thinking: high
      config_dir: .staged/slices/uiux

environment:
  type: daytona
  override_memory_mb: 4096

datasets:
  # Front-end/design: a token contract compiled to CSS and a static gallery, checked
  # by named assertions rather than a judge.
  - name: skill2env/skill2env
    task_names:
      - skill2env/task_frontend-design_omc8cag2
      - skill2env/task_frontend-design-review_pjl5uaib
      - skill2env/task_senior-frontend_hp7ghs3e

  # Visual artifacts: SVG defect repair, `allow_internet = false`, 512 MiB.
  - name: thetalab/vector-edit-gym
    task_names:
      - thetalab/vector-edit-gym-ea-001
      - thetalab/vector-edit-gym-ea-002
      - thetalab/vector-edit-gym-ha-001

n_concurrent_trials: 2

# A slow backend must not be recorded as a failed agent: with the noise measured
# here, a timeout recorded as an agent failure is the largest source of a false
# effect.
agent_timeout_multiplier: 2.0
