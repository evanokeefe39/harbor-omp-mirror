# The ADE-bench suite on Harbor's remote backend — 45 of the dataset's 48 tasks,
# the other three being two that run in the separate memory tier
# (jobs/omp-daytona-ade-bench-heavy.yaml) and one that is excluded from the suite
# entirely, for the platform reason the heavy job's header gives. It is the sibling
# of jobs/omp-ade-bench-full.yaml (same dataset and agent; that job still takes all
# 48, on Docker) and of jobs/omp-daytona-ade-bench.yaml (same backend, same four
# deviations). This job plus the heavy one is 47 tasks; the 48th is the exclusion.
#
# Memory: this is the **4 GiB tier** — the task's own request, so the number is
# comparable with the docker baseline and with the 2026-10-16 run. The tasks
# measured to exceed it run in jobs/omp-daytona-ade-bench-heavy.yaml at 8 GiB,
# and this job excludes them by name. Tiers are separate jobs because the
# memory override is job-scoped and `n_concurrent_trials` is job-global; see
# that job's header. A third tier at 2 GiB was measured on 2026-10-18 and is
# empty: it is *below* the declared request, so a task qualifies only with a
# peak at or under 1536 MiB, and the lowest of the 46 measured peaks is 1668 MiB.
#
# Sandboxes run in Daytona, not here — the registry fetch, the image build and
# the snapshot upload are local, but the trials are not, so a 45-task run costs
# the operator's machine almost nothing after the build. That is the reason to
# reach for this job over the docker one.
#
#   uv run harbor run -c jobs/omp-daytona-ade-bench-full.yaml --yes \
#     --env-file <env-file> -o <fresh-dir>
#
# On Windows the git override is required, not optional:
#
#   GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.autocrlf GIT_CONFIG_VALUE_0=false
#
# Without it the task's verifier arrives CRLF and dies on its shebang in the
# sandbox (`/tests/test.sh: cannot execute: required file not found`), so no
# verifier runs and the task scores 0 for a reason that has nothing to do with
# the agent. The measured cause, and the one trial of four that survived it
# anyway, are recorded in jobs/omp-daytona-ade-bench.yaml and DEFECTS.md.
#
# Four things differ from the docker full job, and all four are deliberate:
#
#   environment.type            daytona
#   environment.env             the dbt index mirror — see "Egress" below
#   override_memory_mb: 4096    the task's own request; the 2026-10-16 run below
#                               used it
#   agent_timeout_multiplier    2.0, a variance cushion — see "Deadline" below
#
# Egress is the difference that would silently zero the run. Daytona Tiers 1-2
# pin outbound traffic to a fixed essential-host list that no sandbox can widen,
# and ADE-bench's verifier runs a bare `dbt deps`, which fetches its package
# index from hub.getdbt.com. In the sandbox that connection is reset; an offline
# `dbt deps` clears `dbt_packages` before failing, so the task dies downstream of
# the index. Measured: an oracle applying the task's own published solution
# scored 0.0 on Daytona, where the omp agent scored 1.0 on docker (no oracle has
# run on docker). `DBT_PACKAGE_HUB_URL` points the
# index at a commit-pinned mirror on GitHub, which the policy does allow, and the
# same oracle trial goes 0.0 -> 1.0.
#
# The mirror **was** partial for the 2026-10-16 run, and a gap scores 0 before a
# test runs: 6 of 48 tasks 404'd on a package it did not carry (asana002,
# asana005, asana005-hard and quickbooks002/3/4) and ran no test at all. Two of
# the six are also among the four trials whose agent phase raised an exception,
# so only four of the six are zeros with no other failure. Three means follow
# from that run: 0.646 over all 48, 0.705 over the 44 whose agent phase raised no
# exception, and 0.738 over the 42 whose verifier executed at least one test.
# `actual_test_total=0` beside the 404 in the trial's verifier/test-stdout.txt is
# the distinguishing evidence. See docs/environments/daytona.md and DEFECTS.md
# 2026-10-16.
#
# The mirror now carries every package this suite declares — dbt-labs/dbt_utils,
# fivetran/asana_source, fivetran/quickbooks_source and fivetran/intercom_source
# — and the whole transitive closure beneath them, as byte-exact copies of
# hub.getdbt.com's. Mirroring only the four was not enough: a re-run of the six
# affected tasks resolved them and then 404'd on fivetran/fivetran_utils, one
# level down. The closure is computed over every version of every package, not
# just `latest`, because an older release carries its own requirements — that is
# how the legacy `fishtown-analytics/*` and `calogica/*` namespaces enter it. The
# pin below is the commit that serves them
# (evanokeefe39/dbt-hub-mirror#1, #2). A run is not done until
# `uv run python scripts/check_verifier_ran.py <run-dir>` exits 0: it names any
# trial that still executed no test.
#
# Both spellings are set because dbt <=1.10
# reads the plain name and 1.11+ the `DBT_ENGINE_` one.
#
# Memory: `override_memory_mb` *replaces* the task's request rather than capping
# it. The pair job halves it to 2048 to keep two concurrent sandboxes cheap, and
# both of its tasks pass there. This job does not, and the reason is the failure
# mode rather than the number: at 2048 a heavier task can fail for a resource
# reason and score 0 in a way no artefact distinguishes from an agent failure,
# while an unavailable 4096 sandbox fails loudly at provisioning. A benchmark
# that can be silently wrong is worse than one that refuses to start. The pairing
# used 2x2048 of the org's shared 10 GiB; this uses 2x4096, which is most of it —
# if another org member is running sandboxes, provisioning is where this job will
# stall.
#
# It must be a whole-GiB multiple: Daytona floors 8000 to 7 GiB and 3000 to
# 2 GiB. 4096 already is.
#
# Deadline: the task's own budget is 600 s, and on this backend 2 of 4 measured
# attempts exhausted it while the agent was still working. Without a multiplier
# those are recorded as failures, which makes the run a measurement of the
# sandbox rather than of the agent. The multiplier is outside the agent's
# control and inside its best interest: it cannot rescue a wrong answer, only a
# slow one. The docker full job deliberately omits it, so the two jobs' timings
# are NOT comparable — compare scores, and compare them knowing this one had the
# cushion.
#
# No `config_dir`: OMP's bundled defaults, so the number is the agent's rather
# than a staged config's.

job_name: omp-daytona-ade-bench-full
jobs_dir: jobs

agents:
  - name: harbor_omp:Omp
    model_name: openrouter/deepseek/deepseek-v4.1-flash
    kwargs:
      # Pinned for the same reason as every other job here: an unpinned run
      # installs @latest, so its result is not comparable to a recorded one.
      version: "18.11.1"
      thinking: high

environment:
  type: daytona
  # The task's own request. Whole-GiB multiple; see "Memory" above.
  override_memory_mb: 4096
  # Keep the dbt hub out of the verifier's path — see "Egress" above. The
  # verifier runs in this same container, so these reach it.
  env:
    DBT_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"
    DBT_ENGINE_PACKAGE_HUB_URL: "https://raw.githubusercontent.com/evanokeefe39/dbt-hub-mirror/33aeb139b31a0a28097b46777d53cfd13b244099/"

datasets:
  - name: ade-bench
    task_names:
      - ade-bench-*
    # The 8 GiB tier is jobs/omp-daytona-ade-bench-heavy.yaml. One job cannot
    # mix memory sizes without losing the concurrency it is for: the memory
    # override is job-scoped and `n_concurrent_trials` is job-global, so a job
    # holding an 8 GiB task must run one trial at a time. Membership is set by
    # `scripts/plan_memory_tiers.py` from measured evidence, not by inspection:
    #
    #   ade-bench-ana-eng007-medium  runs in the heavy job — OOM-killed at 4096
    #                                (`oom_kill 1`, exit 137, `memory.max`
    #                                4294967296), and at 8192 it finished and
    #                                scored 1.0.
    #   ade-bench-intercom003        runs in the heavy job — OOM-killed at 4096 on
    #                                2026-10-18 (`oom_kill 1`, exit 137, `memory.max`
    #                                4294967296; sampled peak 1968 MiB, so the
    #                                spike fell between two samples).
    #   ade-bench-asana005           excluded from the suite entirely — OOM-killed
    #                                at 8192 (`oom_kill 1`, exit 137, `memory.max`
    #                                8589934592), which is also Daytona's
    #                                per-sandbox maximum: a 10 GiB probe is refused
    #                                with "Memory request 10GB exceeds maximum
    #                                allowed per sandbox (8GB)". No sandbox this
    #                                platform can create fits it, so running it
    #                                records a 0 that belongs to the platform
    #                                rather than to the agent. Its 2026-10-16
    #                                exit 137 is unattributed and is not the
    #                                reason; see the heavy job's header and
    #                                DEFECTS.md.
    exclude_task_names:
      - ade-bench-ana-eng007-medium
      - ade-bench-intercom003
      - ade-bench-asana005
    # No `n_tasks`: take the rest of the dataset. At the commit measured on
    # 2026-10-18 the dataset is 48 tasks, so this job runs **45**: the three
    # excluded above, two of which run in the heavy job and one of which is out
    # of the suite, giving the pair 47. The dataset resolves @head, so each
    # trial's lock.json records the commit it actually used and this number
    # should be checked against that.

n_concurrent_trials: 2

# See "Deadline" above: a slow backend must not be recorded as a failed agent.
agent_timeout_multiplier: 2.0
